<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS | SECURE TERMINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root { --primary-red: #ff4d4d; --bg-dark: #0a0a0a; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg-dark); color: white; font-family: 'Share Tech Mono', monospace; overflow: hidden; }
        
        #matrix-canvas { position: fixed; top: 0; left: 0; z-index: 1; opacity: 0.1; pointer-events: none; }

        /* Login Screen */
        #login-screen {
            position: fixed; inset: 0; background: #000;
            display: flex; justify-content: center; align-items: center; z-index: 1000;
            transition: opacity 0.8s ease;
        }
        .login-box { 
            text-align: center; padding: 40px; border: 1px solid #222; 
            background: #050505; box-shadow: 0 0 30px rgba(255, 77, 77, 0.1); 
        }
        h2 { color: var(--primary-red); letter-spacing: 5px; margin-bottom: 20px; }
        
        input { 
            background: #111; border: 1px solid #333; padding: 15px; 
            color: var(--primary-red); font-family: inherit; font-size: 1.2rem; 
            text-align: center; width: 280px; outline: none; margin-bottom: 20px;
        }
        
        .login-btn {
            display: block; width: 100%; padding: 10px; background: var(--primary-red);
            color: black; font-weight: bold; border: none; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px;
        }
        .login-btn:hover { filter: brightness(1.2); }

        /* Dashboard (Hidden) */
        #secure-dashboard { display: none; padding: 50px; position: relative; z-index: 10; }
        .dept-card { background: #111; border: 1px solid #222; padding: 20px; margin-bottom: 20px; border-left: 4px solid var(--primary-red); }
        
        .error-shake { animation: shake 0.3s; border: 1px solid red; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div id="login-screen">
        <div class="login-box">
            <h2>ACCESS REQUIRED</h2>
            <input type="text" id="passInput" placeholder="ENTER CODE" maxlength="15">
            <button class="login-btn" onclick="checkPassword()">Verify Identity</button>
            <p id="msg" style="margin-top: 15px; font-size: 0.8rem; color: #444;">CLEARANCE LEVEL 4 REQUIRED</p>
        </div>
    </div>

    <div id="secure-dashboard">
        <h1 style="color: var(--primary-red); border-bottom: 1px solid #333; padding-bottom: 10px;">ADMINISTRATOR ACCESS GRANTED</h1>
        <div class="dept-card"><h3>ADMINISTRATION</h3><p>Manage facility permissions and staff overrides.</p></div>
        <div class="dept-card"><h3>COMPLIANCE</h3><p>Review protocol enforcement logs.</p></div>
        <div class="dept-card"><h3>INNOVATION</h3><p>Classified blueprints and R&D files.</p></div>
        <a href="index.html" style="color: var(--primary-red); text-decoration: none;">[ LOGOUT ]</a>
    </div>

    <script>
        // Matrix Background Logic
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
        const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = Array(Math.floor(columns)).fill(1);
        function draw() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#ff4d4d"; ctx.font = fontSize + "px monospace";
            drops.forEach((y, i) => {
                const text = letters[Math.floor(Math.random() * letters.length)];
                ctx.fillText(text, i * fontSize, y * fontSize);
                if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }
        setInterval(draw, 50);

        // Fail-Proof Password Logic
        function checkPassword() {
            const val = document.getElementById('passInput').value;
            const screen = document.getElementById('login-screen');
            const dash = document.getElementById('secure-dashboard');
            const msg = document.getElementById('msg');
            const inputField = document.getElementById('passInput');

            // --- THE PASSWORD IS: GPS2026 ---
            if (val.toUpperCase() === "GPS2026") {
                screen.style.opacity = "0";
                setTimeout(() => {
                    screen.style.display = "none";
                    dash.style.display = "block";
                }, 800);
            } else {
                msg.innerText = "INVALID CODE - ACCESS DENIED";
                msg.style.color = "red";
                inputField.classList.add('error-shake');
                setTimeout(() => { 
                    inputField.classList.remove('error-shake'); 
                    inputField.value = "";
                }, 500);
            }
        }

        // Also allow 'Enter' key to work
        document.getElementById('passInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') { checkPassword(); }
        });
    </script>
</body>
</html>
