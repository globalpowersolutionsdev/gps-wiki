<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS | SECURE PERSONNEL TERMINAL</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-red: #ff4d4d;
            --bg-dark: #070707;
            --panel-bg: rgba(15, 15, 15, 0.9);
            --accent-glow: rgba(255, 77, 77, 0.4);
            --border-color: #2a2a2a;
        }

        body, html {
            margin: 0; padding: 0;
            height: 100%;
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        #matrix-canvas {
            position: fixed; top: 0; left: 0; z-index: 1;
            opacity: 0.15; pointer-events: none;
        }

        /* --- LOGIN SCREEN --- */
        #login-screen {
            position: fixed; inset: 0;
            background: radial-gradient(circle at center, #1a0505 0%, #000 100%);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; transition: all 1s ease;
        }

        .login-box {
            text-align: center; padding: 60px;
            border: 1px solid var(--primary-red);
            background: rgba(0,0,0,0.95);
            box-shadow: 0 0 40px var(--accent-glow);
            width: 380px;
        }

        .biometric-scanner {
            width: 70px; height: 70px; margin: 0 auto 25px;
            border: 2px solid var(--primary-red); border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            position: relative;
        }

        .biometric-scanner::after {
            content: ""; width: 40px; height: 2px;
            background: var(--primary-red); position: absolute;
            animation: scanLine 2s infinite ease-in-out;
        }

        @keyframes scanLine { 0%, 100% { transform: translateY(-20px); } 50% { transform: translateY(20px); } }

        #passInput {
            background: transparent; border: 1px solid var(--border-color);
            padding: 15px; color: var(--primary-red);
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.2rem; text-align: center; width: 100%;
            outline: none; margin-bottom: 20px; box-sizing: border-box;
        }

        .verify-btn {
            width: 100%; padding: 12px; background: transparent;
            color: var(--primary-red); border: 1px solid var(--primary-red);
            font-family: 'Share Tech Mono', monospace; font-weight: bold;
            cursor: pointer; transition: 0.3s; text-transform: uppercase;
        }

        .verify-btn:hover { background: var(--primary-red); color: black; box-shadow: 0 0 20px var(--primary-red); }

        /* --- DASHBOARD --- */
        #secure-dashboard {
            position: relative; z-index: 10;
            padding: 60px 10%; display: none;
            overflow-y: auto; height: 100vh; box-sizing: border-box;
        }

        .header-main { border-bottom: 2px solid var(--primary-red); padding-bottom: 20px; margin-bottom: 40px; }
        .header-main h1 { font-family: 'Share Tech Mono', monospace; letter-spacing: 4px; color: var(--primary-red); margin: 0; }

        .dept-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-bottom: 40px; }

        .dept-btn {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            padding: 30px; text-align: left; cursor: pointer;
            transition: 0.4s; backdrop-filter: blur(10px); color: white;
        }

        .dept-btn:hover { border-color: var(--primary-red); box-shadow: 0 0 20px var(--accent-glow); transform: translateY(-5px); }
        .dept-name { color: var(--primary-red); font-family: 'Share Tech Mono'; font-weight: bold; display: block; margin-bottom: 10px; font-size: 1.1rem; }

        /* --- MASKED MODAL STYLES --- */
        #access-modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.95);
            display: none; justify-content: center; align-items: center;
            z-index: 2000; backdrop-filter: blur(15px);
        }
        .modal-box {
            background: #050505; border: 1px solid var(--primary-red);
            padding: 40px; width: 400px; text-align: center;
            box-shadow: 0 0 50px rgba(255, 77, 77, 0.2);
        }
        
        .masked-container {
            position: relative;
            background: #111;
            padding: 20px;
            margin: 20px 0;
            font-family: 'Share Tech Mono', monospace;
            font-size: 1.5rem;
            display: flex;
            justify-content: center;
            letter-spacing: 4px;
        }

        .ghost-text {
            position: absolute;
            color: #333; /* Dark grey for the X's */
            z-index: 1;
            pointer-events: none;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .real-input {
            position: relative;
            z-index: 2;
            background: transparent;
            border: none;
            color: var(--primary-red);
            font-family: inherit;
            font-size: inherit;
            letter-spacing: inherit;
            outline: none;
            width: 100%;
            text-align: center;
            text-transform: uppercase;
        }

        .terminal-feed {
            background: #000; border: 1px solid #222; padding: 20px;
            font-family: 'Share Tech Mono', monospace; color: #00ff00;
            font-size: 0.8rem; height: 180px; overflow-y: auto; border-radius: 4px;
            margin-top: 30px; line-height: 1.5;
        }

        .terminate-btn { display: inline-block; margin-top: 30px; color: #444; text-decoration: none; font-family: 'Share Tech Mono'; cursor: pointer; font-size: 0.8rem; }
        .terminate-btn:hover { color: var(--primary-red); }
        .error-shake { animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .fade-out { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>

    <div id="login-screen">
        <div class="login-box">
            <div class="biometric-scanner">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ff4d4d" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </div>
            <h2 style="font-family:'Share Tech Mono'; letter-spacing:5px;">CLEARANCE REQUIRED</h2>
            <input type="password" id="passInput" placeholder="ENTER SYSTEM KEY">
            <button class="verify-btn" onclick="checkClearance()">Verify Identity</button>
        </div>
    </div>

    <div id="access-modal">
        <div class="modal-box">
            <h3 id="modal-title" style="font-family:'Share Tech Mono'; color:var(--primary-red); letter-spacing:3px;">DEPT ACCESS</h3>
            
            <div class="masked-container">
                <div class="ghost-text" id="ghostDisplay">QA-XXX-XXX</div>
                <input type="text" class="real-input" id="deptCodeInput" spellcheck="false" autocomplete="off">
            </div>

            <button class="verify-btn" onclick="validateDeptCode()">Authorize Access</button>
            <button class="terminate-btn" style="display:block; width:100%; margin-top:20px;" onclick="closeModal()">CANCEL</button>
        </div>
    </div>

    <main id="secure-dashboard">
        <header class="header-main">
            <div style="font-size: 0.7rem; color: #666; letter-spacing: 4px; margin-bottom: 5px;">INTERNAL PERSONNEL NETWORK</div>
            <h1>ADMINISTRATIVE HUB</h1>
        </header>

        <div class="dept-grid">
            <button class="dept-btn" onclick="openAccessModal('Administration', 'ADM')">
                <span class="dept-name">Administration</span>
                <p style="font-size: 0.8rem; color: #999; margin:0;">Personnel management and system overrides.</p>
            </button>
            <button class="dept-btn" onclick="openAccessModal('Compliance', 'CMP')">
                <span class="dept-name">Compliance</span>
                <p style="font-size: 0.8rem; color: #999; margin:0;">Safety protocols and rule enforcement data.</p>
            </button>
            <button class="dept-btn" onclick="openAccessModal('Communications', 'COM')">
                <span class="dept-name">Communications</span>
                <p style="font-size: 0.8rem; color: #999; margin:0;">Public relations and internal bulletins.</p>
            </button>
            <button class="dept-btn" onclick="openAccessModal('Innovation', 'INV')">
                <span class="dept-name">Innovation</span>
                <p style="font-size: 0.8rem; color: #999; margin:0;">Research and development for grid tech.</p>
            </button>
            <button class="dept-btn" onclick="openAccessModal('QA Dept', 'QA')">
                <span class="dept-name">QA Dept</span>
                <p style="font-size: 0.8rem; color: #999; margin:0;">Bug tracking and stability reporting.</p>
            </button>
        </div>

        <div style="font-family: 'Share Tech Mono'; color: #444; font-size: 0.7rem; margin-bottom: 10px;">> LIVE SYSTEM MONITOR</div>
        <div class="terminal-feed" id="terminal-log"></div>

        <a class="terminate-btn" onclick="terminateSession()">[ TERMINATE_SESSION_OVERRIDE ]</a>
    </main>

    <audio id="sndDeny" src="denied.mp3"></audio>
    <audio id="sndGrant" src="granted.mp3"></audio>
    <audio id="sndType" src="terminal_type.mp3"></audio>
    <audio id="sndWipe" src="wipe.mp3"></audio>
    <audio id="sndShutdown" src="shutdown.mp3"></audio>

    <script>
    /* --- 1. CODE REGISTRY --- */
    // Define the valid 6-digit codes (formatted as XXX-XXX)
    const VALID_CODES = {
        "ADM": ["111-222"],
        "CMP": ["444-555"],
        "COM": ["777-888"],
        "INV": ["123-456"],
        "QA":  ["000-111", "555-666"]
    };

    let currentActivePrefix = "";

    /* --- 2. MATRIX EFFECT --- */
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    const characters = "010101"; const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);
    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff4d4d"; ctx.font = fontSize + "px 'Share Tech Mono'";
        drops.forEach((y, i) => {
            const text = characters.charAt(Math.floor(Math.random() * characters.length));
            ctx.fillText(text, i * fontSize, y * fontSize);
            if (y * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        });
    }
    setInterval(drawMatrix, 50);

    /* --- 3. THE "IMMORTAL DASH" MASK LOGIC --- */
    const realInput = document.getElementById('deptCodeInput');
    const ghostDisplay = document.getElementById('ghostDisplay');

    realInput.addEventListener('keydown', (e) => {
        // Stop user from backspacing into the dash at index 3
        // If they are at position 5 (e.g., "000-1"), backspace should just work.
        // If they are at position 4 (e.g., "000-"), backspace jumps back to position 3.
        if (e.key === "Backspace" && realInput.value.length === 4) {
            realInput.value = realInput.value.substring(0, 3);
            e.preventDefault();
        }
    });

    realInput.addEventListener('input', (e) => {
        // 1. Strip everything except numbers
        let raw = realInput.value.replace(/[^0-9]/g, '');
        
        // 2. Limit strictly to 6 digits
        if (raw.length > 6) raw = raw.substring(0, 6);

        // 3. Re-build the string with the forced Dash
        let formatted = "";
        if (raw.length > 3) {
            formatted = raw.substring(0, 3) + "-" + raw.substring(3);
        } else {
            formatted = raw;
        }

        realInput.value = formatted;

        // 4. Update the Ghost Text (QA-XXX-XXX)
        // This ensures X's only disappear where numbers are typed
        let prefixPart = currentActivePrefix + "-";
        let ghostTemplate = "XXX-XXX";
        let userInput = formatted;
        
        let finalGhost = prefixPart;
        for (let i = 0; i < ghostTemplate.length; i++) {
            // If the user has typed a character at this position in the 'formatted' string,
            // we put a space in the ghost layer so the number shows through.
            if (userInput[i]) {
                finalGhost += " "; 
            } else {
                finalGhost += ghostTemplate[i];
            }
        }
        ghostDisplay.innerText = finalGhost;
    });

    /* --- 4. TERMINAL & SYSTEM LOGIC --- */
    function checkClearance() {
        const input = document.getElementById('passInput');
        if (input.value.toUpperCase() === "GPS2026") {
            document.getElementById('sndGrant').play().catch(e=>{});
            document.getElementById('login-screen').classList.add('fade-out');
            setTimeout(() => {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('secure-dashboard').style.display = 'block';
                logToTerminal("> AUTHENTICATION SUCCESSFUL.");
                setTimeout(() => logToTerminal("> CLEARANCE LEVEL 4 RECOGNIZED."), 1200);
            }, 1000);
        } else {
            document.getElementById('sndDeny').play().catch(e=>{});
            input.classList.add('error-shake');
            setTimeout(() => { input.classList.remove('error-shake'); input.value = ""; }, 500);
        }
    }

    function openAccessModal(name, prefix) {
        logToTerminal(`> REQUESTING ACCESS: ${name.toUpperCase()}...`);
        currentActivePrefix = prefix;
        document.getElementById('modal-title').innerText = name + " ACCESS";
        
        // Clear input and reset ghost to the default e.g., QA-XXX-XXX
        realInput.value = "";
        ghostDisplay.innerText = prefix + "-XXX-XXX";
        
        setTimeout(() => { 
            document.getElementById('access-modal').style.display = 'flex'; 
            realInput.focus(); 
        }, 1000);
    }

    function closeModal() { 
        document.getElementById('access-modal').style.display = 'none'; 
        logToTerminal("> REQUEST CANCELLED."); 
    }

    function validateDeptCode() {
        const val = realInput.value;
        if (VALID_CODES[currentActivePrefix].includes(val)) {
            document.getElementById('sndGrant').play().catch(e=>{});
            logToTerminal(`> CLEARANCE VALIDATED: ${currentActivePrefix}-${val}`);
            setTimeout(() => { 
                window.location.href = currentActivePrefix.toLowerCase() + "_hub.html"; 
            }, 1200);
        } else {
            document.getElementById('sndDeny').play().catch(e=>{});
            document.querySelector('.modal-box').classList.add('error-shake');
            logToTerminal(`> [!] ACCESS DENIED: ${currentActivePrefix}-${val}`);
            setTimeout(() => { document.querySelector('.modal-box').classList.remove('error-shake'); }, 500);
        }
    }

    function logToTerminal(msg) {
        const feed = document.getElementById('terminal-log');
        const line = document.createElement('div');
        line.style.marginBottom = "5px"; feed.appendChild(line);
        let i = 0; const typeSound = document.getElementById('sndType');
        function typeChar() {
            if (i < msg.length) {
                typeSound.currentTime = 0; typeSound.play().catch(e=>{});
                line.innerHTML += msg.charAt(i); i++;
                setTimeout(typeChar, 40); feed.scrollTop = feed.scrollHeight;
            }
        }
        typeChar();
    }

    async function terminateSession() {
        document.getElementById('sndWipe').play().catch(e=>{});
        const steps = ["> [!] INITIATING WIPE...", "> SCRUBBING DATA...", "> DISCONNECTED."];
        for (let step of steps) { logToTerminal(step); await new Promise(r => setTimeout(r, 1000)); }
        document.getElementById('sndShutdown').play().catch(e=>{});
        setTimeout(() => { window.location.href = "index.html"; }, 1500);
    }
</script>
</body>
</html>
