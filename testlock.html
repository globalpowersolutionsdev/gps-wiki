<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Official Wiki | Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-red: #ff4d4d;
            --bg-dark: #161616; 
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-dim: #888888;
            --border-color: #2a2a2a;
        }

        body.night-mode {
            --bg-dark: #0a0a0a; 
            --card-bg: #111111;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            transition: background-color 1s ease;
        }

        /* --- STARTUP ANIMATION --- */
        #startup-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex;
            justify-content: center; align-items: center;
            transition: opacity 1s ease, visibility 1s;
        }
        .startup-content { text-align: center; width: 320px; }
        .os-logo { font-weight: 700; font-size: 1.2rem; letter-spacing: 6px; color: #fff; margin-bottom: 20px; }
        .os-logo span { color: var(--primary-red); }
        .loader-bar { width: 100%; height: 2px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
        .loader-progress { width: 0%; height: 100%; background: var(--primary-red); animation: loadProgress 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes loadProgress { to { width: 100%; } }
        .loader-hidden { opacity: 0 !important; visibility: hidden !important; }

        /* --- HERO & DYNAMIC BG --- */
        .hero {
            position: relative;
            padding: 140px 10%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid var(--border-color);
        }
        #hero-bg {
            position: absolute; top: -10%; left: -10%; width: 120%; height: 120%;
            background: linear-gradient(rgba(10,10,10,0.75), rgba(10,10,10,0.95)), 
                        url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=1600');
            background-size: cover; z-index: -1;
        }

        /* --- STATUS PILLS --- */
        .status-container { display: flex; gap: 15px; margin-top: 25px; }
        .status-pill {
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--border-color);
            padding: 6px 14px; border-radius: 50px; font-size: 0.7rem; font-weight: 600;
            display: flex; align-items: center; gap: 8px;
        }
        .dot { width: 6px; height: 6px; border-radius: 50%; }
        .online { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }

        /* --- WIKI GRID --- */
        .main-content { padding: 80px 10%; max-width: 1400px; margin: 0 auto; }
        .wiki-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 35px; }
        .wiki-card {
            background: var(--card-bg); border-radius: 16px; overflow: hidden;
            border: 1px solid var(--border-color); text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: block;
        }
        .wiki-card:hover { transform: translateY(-12px); border-color: var(--primary-red); }
        .card-img { height: 200px; background-size: cover; background-position: center; border-bottom: 1px solid var(--border-color); }
        .card-body { padding: 25px; }
    </style>
</head>
<body>

    <div id="startup-layer">
        <div class="startup-content">
            <div class="os-logo">GPS<span>_TERMINAL</span></div>
            <div class="loader-bar"><div class="loader-progress"></div></div>
            <div style="font-family:monospace; font-size:0.6rem; color:var(--primary-red);">INITIALIZING...</div>
        </div>
    </div>

    <header class="hero">
        <div id="hero-bg"></div>
        <h1 style="color:var(--primary-red); font-size:3.5rem; margin:0;">GPS Official Wiki</h1>
        <div class="status-container">
            <div class="status-pill"><div class="dot online"></div> KHPP: ACTIVE</div>
            <div class="status-pill"><div class="dot online"></div> GRID: STABLE</div>
        </div>
    </header>

    <main class="main-content">
        <div class="wiki-grid">
            <a href="khpphome.html" class="wiki-card">
                <div class="card-img" style="background-image: url('https://via.placeholder.com/500x300/222/888?text=KHPP')"></div>
                <div class="card-body"><h4>Klinton Hydroelectric</h4></div>
            </a>
            <a href="secure.html" class="wiki-card">
                <div class="card-img" style="background-image: url('https://via.placeholder.com/500x300/222/888?text=SECURE')"></div>
                <div class="card-body"><h4>Personnel Terminal</h4></div>
            </a>
        </div>
    </main>

    <script>
        // Start Logic
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('startup-layer').classList.add('loader-hidden');
            }, 2500);
        });

        // Mouse Move BG
        const bg = document.getElementById('hero-bg');
        window.addEventListener('mousemove', (e) => {
            const moveX = (window.innerWidth / 2 - e.pageX) / 45;
            const moveY = (window.innerHeight / 2 - e.pageY) / 45;
            bg.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
    </script>
</body>
</html>
