<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="favicon.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPS Official Wiki | Terminal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* --- DAYTIME COLORS (Lighter Charcoal) --- */
            --primary-red: #ff4d4d;
            --bg-dark: #161616; 
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-dim: #888888;
            --border-color: #2a2a2a;
            --transition-speed: 0.4s;
        }

        /* --- NIGHTTIME COLORS (Deep Onyx) --- */
        /* Triggered automatically by the Script below */
        body.night-mode {
            --bg-dark: #0a0a0a; 
            --card-bg: #111111;
            --border-color: #1a1a1a;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow-x: hidden;
            transition: background-color 1s ease; /* Smooth transition when colors shift */
        }

        /* --- STARTUP ANIMATION LAYER --- */
        #startup-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999; display: flex;
            justify-content: center; align-items: center;
            transition: opacity 1s ease, visibility 1s;
        }
        .startup-content { text-align: center; width: 320px; }
        .os-logo { font-weight: 700; font-size: 1.2rem; letter-spacing: 6px; color: #fff; margin-bottom: 20px; }
        .os-logo span { color: var(--primary-red); }
        .loader-bar { width: 100%; height: 2px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
        .loader-progress { width: 0%; height: 100%; background: var(--primary-red); animation: loadProgress 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .boot-text { font-family: monospace; font-size: 0.65rem; color: var(--primary-red); letter-spacing: 2px; text-transform: uppercase; }
        
        @keyframes loadProgress { to { width: 100%; } }
        .loader-hidden { opacity: 0 !important; visibility: hidden !important; }

        /* --- DYNAMIC HERO SECTION --- */
        .hero {
            position: relative;
            padding: 140px 10%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-bottom: 1px solid var(--border-color);
        }

        #hero-bg {
            position: absolute;
            top: -10%; left: -10%;
            width: 120%; height: 120%;
            background: linear-gradient(rgba(10,10,10,0.75), rgba(10,10,10,0.95)), 
                        url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?w=1600');
            background-size: cover;
            background-position: center;
            z-index: -1;
        }

        .hero h1 { font-size: 3.5rem; margin: 0; color: var(--primary-red); font-weight: 700; text-transform: uppercase; letter-spacing: -2px; }

        /* --- STATUS INDICATORS --- */
        .status-container { display: flex; gap: 15px; margin-top: 25px; }
        .status-pill {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot { width: 6px; height: 6px; border-radius: 50%; }
        .online { background: #2ecc71; box-shadow: 0 0 8px #2ecc71; }
        .offline { background: #e74c3c; box-shadow: 0 0 8px #e74c3c; }

        /* --- SEARCH & WIKI GRID --- */
        .main-content { padding: 80px 10%; max-width: 1400px; margin: 0 auto; }
        .search-area { margin-bottom: 70px; text-align: center; }
        .search-area input {
            width: 100%; max-width: 600px; padding: 20px 30px;
            background: #111; border: 1px solid var(--border-color);
            border-radius: 12px; color: #fff; font-size: 1rem;
            transition: all 0.3s ease;
        }
        .search-area input:focus { outline: none; border-color: var(--primary-red); }

        .wiki-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 35px; }
        
        .wiki-card {
            background: var(--card-bg); border-radius: 16px; overflow: hidden;
            border: 1px solid var(--border-color); text-decoration: none;
            transition: all var(--transition-speed) cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: block;
        }
        .wiki-card:hover { transform: translateY(-12px); border-color: var(--primary-red); }
        
        .card-img { height: 200px; background-size: cover; background-position: center; border-bottom: 1px solid var(--border-color); }
        .card-body { padding: 25px; }
        .card-body h4 { margin: 0; color: #fff; text-transform: uppercase; letter-spacing: 1px; }

        .card-hidden { display: none; }
    </style>
</head>
<body>

    <div id="startup-layer">
        <div class="startup-content">
            <div class="os-logo">GPS<span>_TERMINAL</span></div>
            <div class="loader-bar"><div class="loader-progress"></div></div>
            <div class="boot-text" id="boot-status">Initializing Hardware...</div>
        </div>
    </div>

    <header class="hero">
        <div id="hero-bg"></div>
        <h1>GPS Official Wiki</h1>
        <div class="status-container">
            <div class="status-pill"><div class="dot online"></div> KHPP: ACTIVE</div>
            <div class="status-pill"><div class="dot online"></div> GRID: STABLE</div>
        </div>
    </header>

    <main class="main-content">
        <section class="search-area">
            <input type="text" id="wikiSearch" placeholder="Search GPS database..." onkeyup="runLiveSearch()">
        </section>

        <section class="wiki-grid" id="wikiGrid">
            <a href="khpphome.html" class="wiki-card" data-keywords="khpp klinton power plant hydroelectric">
                <div class="card-img" style="background-image: url('https://via.placeholder.com/500x300/222/888?text=KHPP')"></div>
                <div class="card-body"><h4>Klinton Hydroelectric Power Plant</h4></div>
            </a>
            <a href="#" class="wiki-card" data-keywords="ranks points gps">
                <div class="card-img" style="background-image: url('https://via.placeholder.com/500x300/222/888?text=RANKS')"></div>
                <div class="card-body"><h4>Ranks & Points</h4></div>
            </a>
        </section>
    </main>

    <audio id="sndPower" src="power_on.mp3" preload="auto"></audio>
    <audio id="sndHum" src="system_hum.mp3" preload="auto" loop></audio>
    <audio id="sndBeep" src="bios_beep.mp3" preload="auto"></audio>
    <audio id="sndReady" src="ready.mp3" preload="auto"></audio>
    <audio id="sndHover" src="hover.mp3" preload="auto"></audio>
    <audio id="sndClick" src="click.mp3" preload="auto"></audio>

    <script>
        /* 1. DYNAMIC LIGHTING LOGIC */
        const hour = new Date().getHours();
        // If it's earlier than 6am or later than 6pm, make it dark
        if (hour < 6 || hour >= 18) {
            document.body.classList.add('night-mode');
            console.log("Night Mode Engaged");
        }

        /* 2. BOOT SEQUENCE SOUNDS */
        let audioUnlocked = false;

        function startBootSequence() {
            if(audioUnlocked) return;
            audioUnlocked = true;

            const pwr = document.getElementById('sndPower');
            const hum = document.getElementById('sndHum');
            const beep = document.getElementById('sndBeep');
            const ready = document.getElementById('sndReady');
            const status = document.getElementById('boot-status');

            // Play Power On
            pwr.play();
            
            // Step 1: Hum starts
            setTimeout(() => {
                hum.volume = 0.3;
                hum.play();
                status.innerText = "System Hum Detected...";
            }, 600);

            // Step 2: BIOS Beep
            setTimeout(() => {
                beep.play();
                status.innerText = "BIOS Check: OK";
            }, 1600);

            // Step 3: Finish
            setTimeout(() => {
                ready.play();
                hum.pause(); // Stop hum when site opens
                document.getElementById('startup-layer').classList.add('loader-hidden');
            }, 2500);
        }

        // Unlock audio on first interaction
        window.addEventListener('mousedown', startBootSequence);
        window.addEventListener('keydown', startBootSequence);

        /* 3. MOUSE TRACKING BG */
        const bg = document.getElementById('hero-bg');
        window.addEventListener('mousemove', (e) => {
            const moveX = (window.innerWidth / 2 - e.pageX) / 45;
            const moveY = (window.innerHeight / 2 - e.pageY) / 45;
            bg.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });

        /* 4. LIVE SEARCH */
        function runLiveSearch() {
            const input = document.getElementById('wikiSearch').value.toLowerCase();
            const cards = document.querySelectorAll('.wiki-card');
            cards.forEach(card => {
                if (card.getAttribute('data-keywords').includes(input)) {
                    card.classList.remove('card-hidden');
                } else {
                    card.classList.add('card-hidden');
                }
            });
        }

        /* 5. UI HOVER SOUNDS */
        const hvr = document.getElementById('sndHover');
        document.querySelectorAll('.wiki-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                hvr.currentTime = 0;
                hvr.play().catch(e => {});
            });
        });
    </script>
</body>
</html>
